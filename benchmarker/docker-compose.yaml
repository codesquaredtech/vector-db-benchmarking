
networks:
  vector_db_testing:
    name: vector_db_testing
    external: true


services:
  benchmarker:
    build: .
    volumes:
      - ./main.py:/benchmarker/main.py
      - ./logs:/benchmarker/logs
      - ./app:/benchmarker/app
      - ./input:/benchmarker/input
      - ./results:/benchmarker/results
      - ./util_scripts.py:/benchmarker/util_scripts.py
    networks:
      - vector_db_testing
    command: ["python", "main.py"]
